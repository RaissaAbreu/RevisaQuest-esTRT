name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler os PDFs e montar a base de questões
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python3 tools/gerar_questoes.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar chave de assinatura
        id: chave
        env:
          KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Segredos APP_KEYSTORE_B64 / APP_KEYSTORE_PASSWORD não cadastrados: APK não será publicado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app.jks"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "versao=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK assinado
        if: steps.chave.outputs.ok == 'true'
        env:
          APP_KEYSTORE: ${{ runner.temp }}/app.jks
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: revisaquestoes
          APP_KEY_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ steps.chave.outputs.versao }}
          APP_VERSION_NAME: 1.0.${{ steps.chave.outputs.versao }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk RevisaQuestoesTRT-1.0.${{ steps.chave.outputs.versao }}.apk

      - uses: actions/upload-artifact@v4
        if: steps.chave.outputs.ok == 'true'
        with:
          name: RevisaQuestoesTRT-1.0.${{ steps.chave.outputs.versao }}
          path: RevisaQuestoesTRT-*.apk

      - name: Publicar versão
        if: steps.chave.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ steps.chave.outputs.versao }}" RevisaQuestoesTRT-1.0.${{ steps.chave.outputs.versao }}.apk \
            --title "RevisaQuestõesTRT 1.0.${{ steps.chave.outputs.versao }}" \
            --notes "APK para instalar no Android. Baixe o arquivo .apk abaixo pelo celular e abra para instalar/atualizar (suas respostas, anotações e favoritos são mantidos)."
